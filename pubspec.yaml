name: getsetgo
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you intend to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  url_launcher: ^6.1.10
  shared_preferences: ^2.0.0
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  video_player: ^2.8.3
  table_calendar: ^3.0.9
  intl: ^0.19.0
  permission_handler: ^11.3.1

  # The mailer package is not needed when using url_launcher for mailto links.
  # mailer: ^6.0.0

  # Firebase dependencies
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  fl_chart: ^0.68.0
  google_sign_in: ^6.2.1

  country_picker: ^2.0.21

  # Dependencies for AI Assistant Chatbot (Speech-to-Text and Text-to-Speech)
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # Dependencies for local notifications
  flutter_local_notifications: ^19.3.1
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1 
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 # Added this dependency

# Configuration for flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # The minimum SDK for Android

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/icons8-arrow-24.png
    - assets/images/avatar.png
    - assets/images/home_bg_gif2.jpg
    - assets/images/Blue home.png
    - assets/images/Blue assistant.png
    - assets/images/New habit icon (1).png
    - assets/images/Setting icon (1).png
    - assets/images/Ai_suggestion_bg.jpeg
    - assets/images/habit_trend_graph.png
    - assets/images/bell.png
    - assets/images/info.png
    - assets/images/google_icon.png
    - assets/images/stats_section.png
    - assets/videos/bg_animation.mp4